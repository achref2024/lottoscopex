name: Update lottery draws

on:
  schedule:
    # 06:00 UTC daily — after every lottery's evening draws worldwide have posted.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-draws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run update script
        run: npm run update-draws

      - name: Commit and push if data changed
        run: |
          git config user.name "lottoscopex-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No data changes — nothing to commit."
          else
            git add data/
            git commit -m "Auto-update lottery draw data"
            git push
          fi
